name: Create Science Short

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow gTTS

      - name: Create video
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python bot.py

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: science-short-video
          path: output/
          retention-days: 7
